{% load static %}
<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>[Nama Toko] — Pesan Online</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --app-primary: #10b981;
        --app-primary-hover: #059669;
        --app-bg: #f8fafc;
        --app-text: #0f172a;
        --card-bg: #f1f5f9;
        --card-border: #eef2f6;
      }

      body {
        background-color: var(--app-bg);
        color: var(--app-text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        padding-bottom: 90px;
      }

      .btn-primary-app {
        background-color: var(--app-primary);
        border-color: var(--app-primary);
        color: #ffffff;
      }
      .btn-primary-app:hover,
      .btn-primary-app:active {
        background-color: var(--app-primary-hover);
        border-color: var(--app-primary-hover);
        color: #ffffff;
      }

      .category-chip {
        white-space: nowrap;
        border: 1px solid #e2e8f0;
        background: #ffffff;
        color: #64748b;
        font-weight: 500;
        transition: all 0.2s ease;
      }
      .category-chip.active,
      .category-chip:hover {
        background: var(--app-primary);
        border-color: var(--app-primary);
        color: #ffffff;
      }

      .menu-card {
        border: 1px solid #f1f5f9;
        border-radius: 16px;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .menu-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08) !important;
      }

      .food-cover {
        height: 120px;
        background: #e2e8f0;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #94a3b8;
      }

      /* Bottom Sheet Cart Container */
      .cart-bottom-sheet {
        max-width: 540px;
        margin-left: auto;
        margin-right: auto;
        border-top-left-radius: 24px;
        border-top-right-radius: 24px;
        height: 85vh !important;
      }

      /* Cart Item Soft Card */
      .cart-item-card {
        background-color: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
      }

      /* Capsule Stepper Pill */
      .capsule-stepper {
        background: #ffffff;
        border: 1px solid #cbd5e1;
        padding: 2px;
      }
      .stepper-btn {
        width: 34px;
        height: 34px;
        border: none;
        background: #f8fafc;
        transition: background-color 0.15s ease;
      }
      .stepper-btn:hover {
        background: #e2e8f0;
      }

      /* Cart Solid Footer with Top Shadow */
      .cart-footer {
        background: #ffffff;
        border-top: 1px solid #f1f5f9;
        box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.06);
      }

      /* Floating Action Bar Wrapper */
      .floating-cart-wrapper {
        position: fixed;
        bottom: 16px;
        left: 0;
        right: 0;
        z-index: 1030;
        pointer-events: none;
      }
      .floating-cart-btn {
        pointer-events: auto;
        max-width: 500px;
      }

      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- Top Navigation Header -->
    <nav class="navbar bg-white border-bottom sticky-top shadow-sm py-2">
      <div class="container d-flex align-items-center justify-content-between">
        <a
          class="navbar-brand fw-bold fs-5 text-dark m-0 d-flex align-items-center gap-2"
          href="#"
        >
          <svg
            width="24"
            height="24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
          </svg>
          <span>[Nama Toko]</span>
        </a>
        <span class="badge bg-light text-secondary border fw-normal px-2 py-1">
          [Tagline / Status]
        </span>
      </div>
    </nav>

    <!-- Header / Banner Section -->
    <header class="bg-white border-bottom py-4 mb-3">
      <div class="container">
        <h1 class="h4 fw-bold mb-1">[Judul Promosi / Restoran]</h1>
        <p class="text-secondary small mb-3">
          [Deskripsi singkat toko atau tawaran promo]
        </p>

        <!-- Search Field -->
        <div class="input-group border rounded-3 bg-light overflow-hidden">
          <span class="input-group-text bg-transparent border-0 text-secondary"
            >🔍</span
          >
          <input
            id="search"
            type="search"
            class="form-control bg-transparent border-0 shadow-none py-2"
            placeholder="Cari menu favoritmu…"
          />
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="container">
      <!-- Categories Scrollbar -->
      <div id="categories" class="d-flex gap-2 overflow-auto pb-2 mb-3"></div>

      <!-- Menu Section Header -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2
          class="h6 fw-bold mb-0 text-uppercase tracking-wider text-secondary"
        >
          Daftar Menu
        </h2>
        <span id="menuCount" class="small text-muted"></span>
      </div>

      <!-- Menu Grid Container -->
      <div id="menuGrid" class="row g-3">
        <div class="text-center py-5 text-secondary">Memuat menu…</div>
      </div>
    </main>

    <!-- Floating Bottom Cart Trigger -->
    <div class="floating-cart-wrapper px-3">
      <button
        id="floatingCart"
        class="btn btn-primary-app floating-cart-btn shadow-lg rounded-4 w-100 py-3 px-4 d-none mx-auto d-flex justify-content-between align-items-center"
        data-bs-toggle="offcanvas"
        data-bs-target="#cartDrawer"
      >
        <div class="d-flex align-items-center gap-2">
          <span
            class="badge bg-white text-dark rounded-pill px-2.5 py-1.5 fw-bold"
            id="cartCount"
            >0</span
          >
          <span class="fw-semibold">Lihat Keranjang</span>
        </div>
        <span class="fw-bold fs-6" id="cartTotal">Rp0</span>
      </button>
    </div>

    <!-- Bottom Sheet Cart Drawer -->
    <div
      class="offcanvas offcanvas-bottom cart-bottom-sheet border-0 shadow-lg"
      tabindex="-1"
      id="cartDrawer"
    >
      <!-- Drag Handle Indicator -->
      <div class="w-100 pt-2 pb-1 d-flex justify-content-center">
        <div
          class="bg-secondary opacity-25 rounded-pill"
          style="width: 40px; height: 5px"
        ></div>
      </div>

      <!-- Drawer Header with Item Count -->
      <div class="offcanvas-header border-bottom py-2.5 px-3">
        <h5
          class="fw-bold mb-0 fs-6 text-dark d-flex align-items-center gap-1.5"
        >
          <span>Keranjang Pesanan</span>
          <span id="drawerItemCount" class="text-muted fw-normal fs-6"
            >· 0 item</span
          >
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Tutup"
        ></button>
      </div>

      <!-- Cart Items Container -->
      <div id="cartLines" class="offcanvas-body p-3 overflow-auto"></div>

      <!-- Solid Performance Footer with Shadow -->
      <div class="cart-footer p-3 rounded-bottom-0">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="text-secondary fw-medium">Total Pembayaran</span>
          <span class="fs-5 fw-bold text-dark" id="drawerTotal">Rp0</span>
        </div>
        <button
          id="checkoutButton"
          class="btn btn-primary-app w-100 py-3 rounded-3 fw-bold fs-6"
          disabled
        >
          Lanjut ke Checkout
        </button>
      </div>
    </div>

    <!-- Item Customization Modal -->
    <div class="modal fade" id="itemModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow">
          <div class="modal-header border-bottom">
            <h5 id="modalTitle" class="modal-title fw-bold fs-6"></h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div id="modalBody" class="modal-body p-3"></div>
          <div class="modal-footer border-top bg-light rounded-bottom-4">
            <span class="me-auto fw-bold text-success" id="modalPrice"></span>
            <button id="confirmAdd" class="btn btn-primary-app rounded-3 px-3">
              Tambahkan
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Checkout Modal -->
    <div class="modal fade" id="checkoutModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <form id="checkoutForm" class="modal-content border-0 rounded-4 shadow">
          <div class="modal-header border-bottom">
            <h5 class="modal-title fw-bold fs-6">Detail Pemesanan</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-3">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Nama Pemesan</label>
              <input
                class="form-control"
                name="customer_name"
                required
                placeholder="Masukkan nama Anda"
              />
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">
                Nomor WhatsApp
                <span class="text-muted fw-normal">(Opsional)</span>
              </label>
              <input
                class="form-control"
                name="phone"
                placeholder="08xxxxxxxxxx"
              />
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Tipe Pesanan</label>
              <select class="form-select" name="order_type" id="orderType">
                <option value="TAKEAWAY">Bawa Pulang (Takeaway)</option>
                <option value="DINE_IN">Makan di Tempat (Dine In)</option>
              </select>
            </div>
            <div id="tableField" class="mb-3 d-none">
              <label class="form-label small fw-semibold">Nomor Meja</label>
              <input
                class="form-control"
                name="table_number"
                placeholder="Contoh: Meja 05"
              />
            </div>
            <div class="mb-2">
              <label class="form-label small fw-semibold">
                Catatan Pesanan
                <span class="text-muted fw-normal">(Opsional)</span>
              </label>
              <textarea
                class="form-control"
                name="note"
                rows="2"
                placeholder="Contoh: Tanpa pedas, sendok plastik..."
              ></textarea>
            </div>
            <div
              id="checkoutError"
              class="alert alert-danger d-none mt-3 mb-0 py-2 small"
            ></div>
          </div>
          <div class="modal-footer border-top bg-light rounded-bottom-4">
            <button
              class="btn btn-primary-app w-100 py-2 fw-bold"
              type="submit"
            >
              Konfirmasi & Buat Pesanan
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Notification Toast Container -->
    <div
      id="toastArea"
      class="toast-container position-fixed top-0 end-0 p-3"
      style="z-index: 1080"
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const money = (v) =>
        new Intl.NumberFormat("id-ID", {
          style: "currency",
          currency: "IDR",
          maximumFractionDigits: 0,
        }).format(v);

      // SVG Placeholder Icon (Replaces Emojis)
      const placeholderIcon = `
        <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="4"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>`;

      const csrf = () =>
        document.cookie
          .split("; ")
          .find((v) => v.startsWith("csrftoken="))
          ?.split("=")[1] || "";

      const api = async (url, options = {}) => {
        const res = await fetch(url, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrf(),
            ...(options.headers || {}),
          },
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Terjadi kesalahan.");
        return data;
      };

      let menu = [],
        cart = { items: [], total: "0.00" },
        chosen = null,
        category = "Semua";

      const toast = (text) => {
        const el = document.createElement("div");
        el.className = "toast align-items-center text-bg-dark border-0 shadow";
        el.innerHTML = `<div class="d-flex"><div class="toast-body">${text}</div><button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
        document.querySelector("#toastArea").append(el);
        new bootstrap.Toast(el).show();
      };

      function renderMenu() {
        const query = document.querySelector("#search").value.toLowerCase();
        const filtered = menu.filter(
          (x) =>
            (category === "Semua" || x.category === category) &&
            x.name.toLowerCase().includes(query),
        );
        document.querySelector("#menuCount").textContent =
          `${filtered.length} menu`;

        document.querySelector("#menuGrid").innerHTML =
          filtered
            .map(
              (x) => `
            <div class="col-6 col-md-4 col-lg-3">
              <article class="card menu-card h-100 bg-white p-2">
                <div class="food-cover mb-2">${placeholderIcon}</div>
                <div class="card-body p-1 d-flex flex-column">
                  <span class="badge bg-light text-secondary border w-auto align-self-start mb-1" style="font-size:0.7rem">${x.category}</span>
                  <h3 class="h6 fw-bold mb-1 text-truncate">${x.name}</h3>
                  <p class="small text-muted line-clamp-2 mb-3 flex-grow-1">${x.description || "Pilihan menu spesial"}</p>
                  <div class="d-flex align-items-center justify-content-between mt-auto gap-1">
                    <span class="fw-bold text-dark small">${money(x.price)}</span>
                    <button class="btn btn-sm btn-primary-app rounded-pill px-2.5 py-1" onclick="openItem(${x.id})">+ Tambah</button>
                  </div>
                </div>
              </article>
            </div>`,
            )
            .join("") ||
          '<div class="col-12 text-center py-5 text-secondary">Menu tidak ditemukan.</div>';
      }

      function renderCategories() {
        const cats = ["Semua", ...new Set(menu.map((x) => x.category))];
        document.querySelector("#categories").innerHTML = cats
          .map(
            (c) =>
              `<button class="btn category-chip rounded-pill px-3 py-1.5 small ${c === category ? "active" : ""}" onclick="setCategory('${c}')">${c}</button>`,
          )
          .join("");
      }

      function setCategory(value) {
        category = value;
        renderCategories();
        renderMenu();
      }

      function openItem(id) {
        chosen = menu.find((x) => x.id === id);
        document.querySelector("#modalTitle").textContent = chosen.name;
        document.querySelector("#modalPrice").textContent =
          `Mulai ${money(chosen.price)}`;

        const variants = chosen.variants
          .map(
            (g) =>
              `<div class="mb-3"><label class="form-label fw-semibold small">${g.name}${g.required ? " *" : ""}</label>${g.options.map((o) => `<div class="form-check"><input class="form-check-input variant-choice" type="radio" name="group-${g.id}" value="${o.id}" ${g.required ? "required" : ""}><label class="form-check-label small">${o.name} <span class="text-muted">${Number(o.price_adjustment) ? "+" + money(o.price_adjustment) : ""}</span></label></div>`).join("")}</div>`,
          )
          .join("");

        const addons = chosen.addons.length
          ? `<div class="mb-3"><label class="form-label fw-semibold small">Tambahan</label>${chosen.addons.map((a) => `<div class="form-check"><input class="form-check-input addon-choice" type="checkbox" value="${a.id}"><label class="form-check-label small">${a.name} <span class="text-muted">+${money(a.price)}</span></label></div>`).join("")}</div>`
          : "";

        document.querySelector("#modalBody").innerHTML =
          `${variants}${addons}<label class="form-label fw-semibold small mt-1">Jumlah</label><input id="itemQty" class="form-control" type="number" min="1" value="1">`;

        bootstrap.Modal.getOrCreateInstance("#itemModal").show();
      }

      async function refreshCart() {
        cart = await api("/api/cart/");
        const count = cart.items.reduce((n, x) => n + x.quantity, 0);

        const floatingCartEl = document.querySelector("#floatingCart");
        if (count > 0) {
          floatingCartEl.classList.remove("d-none");
        } else {
          floatingCartEl.classList.add("d-none");
        }

        document.querySelector("#cartCount").textContent = `${count} Item`;
        document.querySelector("#drawerItemCount").textContent =
          `· ${count} item`;
        document.querySelector("#cartTotal").textContent = money(cart.total);
        document.querySelector("#drawerTotal").textContent = money(cart.total);
        document.querySelector("#checkoutButton").disabled = !count;

        // Render Cart Items / Empty State
        if (!cart.items.length) {
          document.querySelector("#cartLines").innerHTML = `
            <div class="text-center py-5">
              <div class="mb-3 text-secondary opacity-50">
                <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                  <path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                </svg>
              </div>
              <h6 class="fw-bold text-dark mb-1">Keranjangmu Masih Kosong</h6>
              <p class="small text-muted mb-4">Yuk, pilih menu favoritmu terlebih dahulu!</p>
              <button class="btn btn-outline-secondary rounded-pill btn-sm px-4" data-bs-dismiss="offcanvas">Mulai Pilih Menu</button>
            </div>`;
          return;
        }

        document.querySelector("#cartLines").innerHTML = cart.items
          .map((x) => {
            const variantText = [
              ...x.variants.map((v) => v.name),
              ...x.addons.map((a) => a.name),
            ].join(" · ");
            const unitPrice = Number(x.line_total) / x.quantity;

            const priceDisplay =
              x.quantity > 1
                ? `<div class="d-flex align-items-baseline gap-1">
                   <span class="fw-bold text-success fs-6">${money(x.line_total)}</span>
                   <span class="small text-muted fw-normal">(${money(unitPrice)}/porsi)</span>
                 </div>`
                : `<span class="fw-bold text-success fs-6">${money(x.line_total)}</span>`;

            return `
              <div class="cart-item-card p-3 mb-2.5">
                <!-- Top Row: Name & Delete Button -->
                <div class="d-flex justify-content-between align-items-start gap-2 mb-1.5">
                  <div class="d-flex align-items-center gap-2">
                    <div class="bg-white rounded-3 d-flex align-items-center justify-content-center border flex-shrink-0" style="width: 32px; height: 32px; color: #94a3b8;">
                      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <rect x="3" y="3" width="18" height="18" rx="4"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <path d="M21 15l-5-5L5 21"/>
                      </svg>
                    </div>
                    <div>
                      <h6 class="fw-bold text-dark m-0 fs-6">${x.name}</h6>
                      ${variantText ? `<div class="mt-1"><span class="badge bg-white text-secondary border fw-normal px-2 py-0.5 rounded-pill small">${variantText}</span></div>` : '<div class="small text-muted">Tanpa tambahan</div>'}
                    </div>
                  </div>

                  <button 
                    class="btn btn-sm text-danger bg-danger-subtle rounded-pill px-2.5 py-1 border-0 d-inline-flex align-items-center gap-1" 
                    aria-label="Hapus ${x.name}" 
                    onclick="removeLine('${x.id}')"
                  >
                    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                    </svg>
                    <span class="small fw-medium">Hapus</span>
                  </button>
                </div>

                <!-- Bottom Row: Price Hierarchy & Capsule Stepper -->
                <div class="d-flex align-items-center justify-content-between mt-3 pt-2 border-top border-light-subtle">
                  <div>${priceDisplay}</div>
                  
                  <div class="capsule-stepper rounded-pill d-inline-flex align-items-center shadow-sm">
                    <button 
                      class="btn btn-sm stepper-btn rounded-circle d-flex align-items-center justify-content-center p-0" 
                      onclick="changeQty('${x.id}',${x.quantity - 1})"
                      aria-label="Kurangi jumlah ${x.name}"
                    >
                      ${
                        x.quantity === 1
                          ? `<svg width="13" height="13" fill="none" stroke="#dc2626" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>`
                          : `<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M20 12H4"/></svg>`
                      }
                    </button>
                    
                    <span class="px-2.5 fw-bold small text-dark">${x.quantity}</span>
                    
                    <button 
                      class="btn btn-sm stepper-btn rounded-circle d-flex align-items-center justify-content-center p-0" 
                      onclick="changeQty('${x.id}',${x.quantity + 1})"
                      aria-label="Tambah jumlah ${x.name}"
                    >
                      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
                    </button>
                  </div>
                </div>
              </div>`;
          })
          .join("");
      }

      async function changeQty(id, quantity) {
        try {
          await api("/api/cart/" + id + "/", {
            method: "PATCH",
            body: JSON.stringify({ quantity }),
          });
          refreshCart();
        } catch (e) {
          toast(e.message);
        }
      }

      async function removeLine(id) {
        try {
          await api("/api/cart/" + id + "/", { method: "DELETE" });
          refreshCart();
        } catch (e) {
          toast(e.message);
        }
      }

      document.querySelector("#confirmAdd").onclick = async () => {
        const form = document.querySelector("#modalBody");
        const invalid = form.querySelector("input:invalid");
        if (invalid && !invalid.reportValidity()) return;
        try {
          await api("/api/cart/add/", {
            method: "POST",
            body: JSON.stringify({
              menu_item_id: chosen.id,
              quantity: Number(document.querySelector("#itemQty").value),
              variant_ids: [
                ...document.querySelectorAll(".variant-choice:checked"),
              ].map((x) => Number(x.value)),
              addon_ids: [
                ...document.querySelectorAll(".addon-choice:checked"),
              ].map((x) => Number(x.value)),
            }),
          });
          bootstrap.Modal.getInstance("#itemModal").hide();
          await refreshCart();
          toast("Ditambahkan ke keranjang");
        } catch (e) {
          toast(e.message);
        }
      };

      document.querySelector("#search").oninput = renderMenu;
      document.querySelector("#checkoutButton").onclick = () => {
        const cartDrawerEl = document.querySelector("#cartDrawer");
        const drawerInstance = bootstrap.Offcanvas.getInstance(cartDrawerEl);
        if (drawerInstance) drawerInstance.hide();
        bootstrap.Modal.getOrCreateInstance("#checkoutModal").show();
      };

      document.querySelector("#orderType").onchange = (e) =>
        document
          .querySelector("#tableField")
          .classList.toggle("d-none", e.target.value !== "DINE_IN");

      document.querySelector("#checkoutForm").onsubmit = async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        const error = document.querySelector("#checkoutError");
        try {
          const order = await api("/api/orders/checkout/", {
            method: "POST",
            body: JSON.stringify(data),
          });
          bootstrap.Modal.getInstance("#checkoutModal").hide();
          await refreshCart();
          toast(
            `Pesanan ${order.public_id} berhasil dibuat — Total ${money(order.total)}`,
          );
        } catch (err) {
          error.textContent = err.message;
          error.classList.remove("d-none");
        }
      };

      Promise.all([api("/api/menu/"), refreshCart()])
        .then(([data]) => {
          menu = data.items;
          renderCategories();
          renderMenu();
        })
        .catch((e) => {
          document.querySelector("#menuGrid").innerHTML =
            `<div class="col-12"><div class="alert alert-danger">${e.message}</div></div>`;
        });
    </script>
  </body>
</html>
