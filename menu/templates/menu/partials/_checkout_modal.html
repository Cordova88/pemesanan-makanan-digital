<div class="modal fade" id="checkoutModal" tabindex="-1" aria-labelledby="checkoutTitle">
  <div class="modal-dialog modal-dialog-centered">
    <form id="checkoutForm" class="modal-content border-0 shadow">
      <div class="modal-header p-4"><h2 id="checkoutTitle" class="modal-title fw-bold fs-5">Detail Pemesanan</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Tutup checkout"></button></div>
      <div class="modal-body px-4">
        <label class="form-label fw-semibold">Nama Pemesan</label>
        <input class="form-control mb-3" name="customer_name" required placeholder="Masukkan nama Anda">
        <label class="form-label fw-semibold">Nomor WhatsApp <span class="text-muted fw-normal">(Opsional)</span></label>
        <input class="form-control mb-3" name="phone" placeholder="08xxxxxxxxxx">
        <label class="form-label fw-semibold">Tipe Pesanan</label>
        <select class="form-select mb-3" name="order_type" id="orderType"><option value="TAKEAWAY">Bawa Pulang</option><option value="DINE_IN">Makan di Tempat</option></select>
        <div id="tableScanContainer" class="d-none mb-3">
          <div id="tableDetectedBanner" class="alert alert-success d-none"><span>Meja terdeteksi: </span><strong id="detectedTableName">Meja --</strong><button type="button" id="btnRescan" class="btn btn-sm btn-outline-success ms-2">Ganti</button></div>
          <div id="scannerBox" class="qr-scanner-box">
            <div id="scannerInitialState" class="text-center p-3"><p class="small text-secondary">Pindai QR meja untuk melanjutkan</p><button type="button" id="btnStartScan" class="btn btn-sm btn-primary-app rounded-pill">Pindai QR Meja</button></div>
            <div id="cameraViewport" class="w-100 h-100 d-none position-relative"><div id="tableQrReader"></div><div class="position-absolute bottom-0 start-0 end-0 p-2 bg-dark text-white d-flex justify-content-between"><span id="scanStatus" class="small">Arahkan ke QR Meja...</span><button type="button" id="btnStopScan" class="btn btn-sm btn-outline-light">Batal</button></div></div>
          </div>
        </div>
        <label class="form-label fw-semibold">Catatan Pesanan <span class="text-muted fw-normal">(Opsional)</span></label>
        <textarea class="form-control mb-3" name="note" rows="2" placeholder="Contoh: Tanpa pedas, sendok plastik..."></textarea>
        <div id="checkoutError" class="alert alert-danger d-none"></div>
      </div>
      <div class="modal-footer p-4"><button id="btnSubmitCheckout" class="btn btn-primary-app w-100 py-3 fw-bold" type="submit">Konfirmasi & Buat Pesanan</button></div>
    </form>
  </div>
</div>
