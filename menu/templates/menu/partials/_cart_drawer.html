<div class="offcanvas offcanvas-bottom cart-bottom-sheet border-0 shadow-lg" tabindex="-1" id="cartDrawer" aria-labelledby="cartDrawerTitle">
  <div class="w-100 pt-2 pb-1 d-flex justify-content-center"><div class="bg-stone-300 rounded-pill" style="width:40px;height:5px"></div></div>
  <div class="offcanvas-header border-bottom px-4 py-3">
    <h2 id="cartDrawerTitle" class="fw-bold fs-5 mb-0">Keranjang <span id="drawerItemCount" class="text-muted fw-normal fs-6">· 0 item</span></h2>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Tutup keranjang"></button>
  </div>
  <div id="cartLines" class="offcanvas-body px-4 py-2 overflow-auto"></div>
  <footer class="cart-footer p-4">
    <div class="d-flex justify-content-between mb-3"><span class="text-secondary">Total</span><strong id="drawerTotal" class="fs-5">Rp0</strong></div>
    <button id="checkoutButton" class="btn btn-primary-app w-100 py-3 rounded-3 fw-bold" disabled>Lanjut ke Checkout</button>
  </footer>
</div>
