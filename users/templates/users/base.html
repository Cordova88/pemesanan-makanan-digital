<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{% block title %}RasaKita CMS{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand: #10b981;
      }
      body {
        background: #f8fafc;
        color: #172033;
      }
      .sidebar {
        width: 250px;
        background: #10251e;
        min-height: 100vh;
      }
      .sidebar a {
        color: #b9ccc4;
        text-decoration: none;
      }
      .sidebar a:hover,
      .sidebar a.active {
        color: #fff;
        background: #1d493a;
      }
      .brand {
        color: #fff !important;
      }
      .nav-label {
        font-size: 0.7rem;
        color: #83a294;
        letter-spacing: 0.08em;
      }
      .content {
        max-width: 1400px;
      }
      .stat {
        border: 0;
        border-radius: 14px;
      }
      .table > * > * {
        white-space: nowrap;
      }
      @media (max-width: 991px) {
        .sidebar {
          min-height: auto;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="d-lg-flex">
      <aside class="sidebar p-3 d-none d-lg-flex flex-column position-fixed">
        <a class="brand fs-4 fw-bold mb-4" href="{% url 'staff:dashboard' %}"
          >RasaKita <small class="fs-6 fw-normal">CMS</small></a
        >{% include 'users/nav.html' %}
      </aside>
      <main class="flex-grow-1 ms-lg-auto" style="min-width: 0">
        <nav class="navbar bg-white border-bottom px-3 d-lg-none">
          <a class="navbar-brand fw-bold" href="{% url 'staff:dashboard' %}"
            >RasaKita CMS</a
          ><button
            class="btn btn-outline-success"
            data-bs-toggle="offcanvas"
            data-bs-target="#nav"
          >
            Menu
          </button>
        </nav>
        <div class="offcanvas offcanvas-start" id="nav">
          <div class="offcanvas-header">
            <h5>RasaKita CMS</h5>
            <button class="btn-close" data-bs-dismiss="offcanvas"></button>
          </div>
          <div class="offcanvas-body sidebar">
            {% include 'users/nav.html' %}
          </div>
        </div>
        <div class="content p-3 p-md-4 mx-auto">
          {% if messages %}{% for message in messages %}
          <div
            class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show"
          >
            {{ message }}<button
              class="btn-close"
              data-bs-dismiss="alert"
            ></button>
          </div>
          {% endfor %}{% endif %}{% block content %}{% endblock %}
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
