<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Masuk Staf — RasaKita</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #f0fdf4;
      }
      .card {
        max-width: 420px;
        border: 0;
        border-radius: 18px;
      }
      .mark {
        background: #10b981;
        width: 52px;
        height: 52px;
      }
      .btn-success {
        background: #10b981;
        border-color: #10b981;
      }
    </style>
  </head>
  <body class="min-vh-100 d-flex align-items-center p-3">
    <main class="card shadow-sm w-100 mx-auto">
      <div class="card-body p-4 p-md-5">
        <div
          class="mark rounded-circle d-flex align-items-center justify-content-center text-white fs-4 mb-3"
        >
          R
        </div>
        <h1 class="h3 fw-bold mb-1">RasaKita</h1>
        <p class="text-secondary mb-4">Masuk ke panel manajemen restoran.</p>
        <form method="post" novalidate>
          {% csrf_token %}{% if form.non_field_errors %}
          <div class="alert alert-danger py-2">{{ form.non_field_errors }}</div>
          {% endif %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Username</label
            ><input
              class="form-control {% if form.username.errors %}is-invalid{% endif %}"
              id="id_username"
              name="username"
              autofocus
              required
            />{% for error in form.username.errors %}
            <div class="invalid-feedback">{{ error }}</div>
            {% endfor %}
          </div>
          <div class="mb-4">
            <label class="form-label" for="id_password">Password</label>
            <div class="input-group">
              <input
                class="form-control {% if form.password.errors %}is-invalid{% endif %}"
                id="id_password"
                name="password"
                type="password"
                required
              /><button
                class="btn btn-outline-secondary"
                type="button"
                onclick="
                  const p = document.querySelector('#id_password');
                  p.type = p.type === 'password' ? 'text' : 'password';
                "
              >
                Lihat
              </button>
            </div>
            {% for error in form.password.errors %}
            <div class="text-danger small mt-1">{{ error }}</div>
            {% endfor %}
          </div>
          <button class="btn btn-success w-100 py-2">Masuk</button>
        </form>
      </div>
    </main>
  </body>
</html>
