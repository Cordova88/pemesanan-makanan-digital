{% if page_obj.paginator.num_pages > 1 %}
<div class="card-footer d-flex flex-wrap justify-content-between align-items-center gap-2">
  <small class="text-secondary">Halaman {{ page_obj.number }} dari {{ page_obj.paginator.num_pages }}</small>
  <nav class="d-flex flex-wrap gap-2" aria-label="Navigasi halaman">
    {% if page_obj.has_previous %}<a class="btn btn-sm btn-outline-secondary" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Sebelumnya</a>{% endif %}
    {% if page_obj.has_next %}<a class="btn btn-sm btn-outline-secondary" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Berikutnya</a>{% endif %}
  </nav>
</div>
{% endif %}
