<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Kasir — RasaKita{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--app-primary:#10b981;--app-primary-hover:#059669;--app-bg:#f8fafc;--app-text:#0f172a;--line:#e2e8f0}
body{background:var(--app-bg);color:var(--app-text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.k-wrap{max-width:1200px}
.k-card{background:#fff;border:1px solid #f1f5f9;border-radius:16px}
.btn-primary-app{background:var(--app-primary);border-color:var(--app-primary);color:#fff;border-radius:999px;font-weight:600;padding:.55rem 1.3rem}
.btn-primary-app:hover,.btn-primary-app:active{background:var(--app-primary-hover);border-color:var(--app-primary-hover);color:#fff}
.btn-pill{border-radius:999px}
.category-chip{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#64748b;font-weight:500;border-radius:999px;padding:.5rem 1.1rem;text-decoration:none;transition:all .2s ease}
.category-chip.active,.category-chip:hover{background:var(--app-primary);border-color:var(--app-primary);color:#fff}
.k-label{font-size:.75rem;font-weight:700;letter-spacing:.05em;color:#64748b;text-transform:uppercase}
.k-input{background:#f1f5f9;border:1px solid var(--line);border-radius:12px;padding:.7rem 1rem}
.k-input:focus{background:#fff;border-color:var(--app-primary);box-shadow:0 0 0 .2rem rgba(16,185,129,.15)}
</style>
</head>
<body>
<nav class="navbar bg-white border-bottom sticky-top shadow-sm py-2">
  <div class="container k-wrap d-flex align-items-center justify-content-between">
    <a class="navbar-brand fw-bold fs-5 text-dark m-0 d-flex align-items-center gap-2" href="{% url 'kasir:dashboard' %}">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
      <span>RasaKita</span>
      <span class="badge bg-light text-secondary border fw-normal">Kasir</span>
    </a>
    <div class="d-flex align-items-center gap-3">
      <span class="text-secondary small d-none d-sm-inline">{{ request.user.get_full_name|default:request.user.username }}</span>
      <a class="btn btn-outline-secondary btn-sm btn-pill px-3" href="{% url 'staff:logout' %}">Keluar</a>
    </div>
  </div>
</nav>
<main class="container k-wrap py-4">{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
