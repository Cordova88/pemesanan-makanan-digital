{% extends 'users/base.html' %}{% block content %}
<h1 class="h3 mb-4">Audit Log</h1>
<div class="card border-0 shadow-sm">
  <div class="table-responsive">
    <table class="table mb-0">
      <thead>
        <tr>
          <th>Waktu</th>
          <th>Order</th>
          <th>Aksi</th>
          <th>Pengguna</th>
        </tr>
      </thead>
      <tbody>
        {% for log in logs %}
        <tr>
          <td>{{ log.created_at|date:'d M Y H:i' }}</td>
          <td>{{ log.order.public_id }}</td>
          <td>{{ log.get_action_display }}</td>
          <td>{{ log.actor|default:'System' }}</td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="4" class="text-center py-4">Belum ada aktivitas.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
